<!doctype html>
<html>
	<body style="font-family: monospace; background: #111; color: #6ee06e; padding: 20px; font-size: 13px; line-height: 2">
		<div id="o">loading...</div>
		<script>
			var IDS = ["4sc9fmf9l7", "2whhqxvict", "f4lr10g1fp", "2gkqxcifmv"],
				o = document.getElementById("o");
			o.textContent = "";
			IDS.forEach(function (id) {
				fetch("https://fast.wistia.com/oembed?url=" + encodeURIComponent("https://fast.wistia.net/embed/iframe/" + id))
					.then(function (r) {
						return r.json();
					})
					.then(function (j) {
						var d = document.createElement("div");
						d.innerHTML = "<b>" + id + "</b> — " + (j.title || "?") + '<br><a style="color:#8ab4ff" href="' + j.thumbnail_url + '">' + j.thumbnail_url + "</a><br>";
						o.appendChild(d);
					})
					.catch(function (e) {
						o.appendChild(document.createTextNode(id + ": " + e.message));
					});
			});
		</script>
	</body>
</html>
